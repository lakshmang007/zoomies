name: Bug report
description: Something in Zoomies doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For a security problem, please use [private reporting](https://github.com/lakshmang007/zoomies/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Ctrl+Alt+Space
        2. Type "invoice"
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zoomies version
      description: Settings → About
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Installer (Zoomies-win-Setup.exe)
        - Portable zip
        - Built from source
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error log (optional)
      description: The end of `%APPDATA%\Zoomies\logs\errors.log`, if it exists. Remove any file names you'd rather not share.
      render: text
  - type: checkboxes
    id: searched
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues and this isn't one of them.
          required: true

name: Feature idea
description: Suggest something Zoomies could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or annoyance, in your own words. "I keep losing…" is a great start.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine Zoomies solving it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Other apps, workarounds, or nothing at all.

# Publishing a version: push a tag such as v0.2.0. This workflow tests the code, builds Zoomies-win-Setup.exe and the
# update packages, and publishes them as a GitHub Release, where installed copies of Zoomies find the update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/Zoomies.Core.Tests -c Release

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Version from tag
        shell: pwsh
        run: '"VERSION=$("${{ github.ref_name }}".TrimStart("v"))" >> $env:GITHUB_ENV'

      # The previous release lets vpk make a small delta update next to the full one. There is none the first time.
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o artifacts/releases

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($env:VERSION))[ \t]*\r?\n(.*?)(?=^## |\z)")
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Zoomies $env:VERSION" }
          Set-Content artifacts/notes.md $notes -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: ./build/package.ps1 -Version $env:VERSION -ReleaseNotes artifacts/notes.md

      - name: Publish release
        run: vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o artifacts/releases --publish --releaseName "Zoomies ${{ env.VERSION }}" --tag ${{ github.ref_name }}

      - name: Release page notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --repo ${{ github.repository }} --notes-file artifacts/notes.md
